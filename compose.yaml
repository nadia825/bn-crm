name: bn-crm

services:
  app:
    image: bn-crm:local
    container_name: bn-crm
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${BN_CRM_PORT:-3000}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
